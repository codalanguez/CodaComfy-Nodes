name: Publish to Comfy Registry
on: workflow_dispatch
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'codalanguez/CodaComfy-Nodes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publisher configuration
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::Add the publisher API key as the REGISTRY_ACCESS_TOKEN repository secret."
            exit 1
          fi
      - uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
