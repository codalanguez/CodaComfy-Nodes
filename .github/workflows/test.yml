name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy Pillow aiohttp av
      - run: python -m unittest discover -s tests -v
      - run: node --check web/openrouter.js
      - run: node --check web/chooser.js
      - run: node --check web/gallery.js
      - run: node --test tests/test_lora_browser_cache.mjs
